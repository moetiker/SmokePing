server.document-root = "/opt/smokeping/htdocs"
server.port = 4265
server.bind = "0.0.0.0"

# Required modules
server.modules = (
    "mod_fastcgi",
    "mod_alias",
    "mod_redirect",
)

# MIME types
mimetype.assign = (
    ".html" => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".png"  => "image/png",
    ".gif"  => "image/gif",
    ".jpg"  => "image/jpeg",
    ".svg"  => "image/svg+xml",
)

# Index file
index-file.names = ( "index.html" )

# Serve cached graph images directly
alias.url = (
    "/cache" => "/opt/smokeping/cache",
)

# SmokePing FastCGI — the smokeping_cgi script uses CGI::Fast
# and keeps the Perl process alive across requests, avoiding
# ~220ms of module compilation + config parsing per hit.
fastcgi.server = (
    "/smokeping.cgi" => ((
        "bin-path"    => "/opt/smokeping/bin/smokeping_cgi",
        "socket"      => "/tmp/smokeping-fcgi.sock",
        "check-local" => "disable",
        "max-procs"   => 3,
        "idle-timeout" => 60,
    )),
)

# Redirect / to smokeping.cgi
url.redirect = (
    "^/$" => "/smokeping.cgi",
)
